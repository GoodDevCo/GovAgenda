name: Auto-refresh tracker

# The engine that keeps GovAgenda current. Runs daily, researches Belle Isle from
# official sources via scripts/refresh.mjs, and — only if something new is found —
# commits the data change and deploys the site. Monday runs also write a weekly roll-up.
#
# Requires repo secret: ANTHROPIC_API_KEY
# Optional repo variable: REFRESH_MODEL (defaults to a Sonnet-class model in the script)

on:
  schedule:
    - cron: '15 11 * * *'   # ~07:15 America/New_York (daily watch; Mondays also do the weekly roll-up)
  workflow_dispatch:
    inputs:
      mode:
        description: 'watch or weekly'
        required: false
        default: 'watch'
      dry_run:
        description: 'Research + report only, do not commit/publish'
        type: boolean
        required: false
        default: false
      window:
        description: 'Backfill a closed date range, e.g. 2026-08-02..2026-08-09. Leave blank for a normal forward run.'
        required: false
        default: ''

permissions:
  contents: write     # commit new entries
  pages: write        # deploy
  id-token: write
  issues: write       # open a tracking issue when a run fails

concurrency:
  group: pages        # shared with deploy.yml so Pages deploys never overlap
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide mode (Monday = weekly)
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%u)" = "1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=watch" >> "$GITHUB_OUTPUT"
          fi

      # Weekly-only. Deterministic — no model call — checks the registry against the
      # city's own calendar page and opens/updates/closes a `calendar-mismatch` issue.
      # Separate from refresh-failure: a data mismatch isn't a broken pipeline, and
      # merging those two signals is how the false "held" statuses stayed invisible
      # for seven weeks. Runs regardless of whether the research step below succeeds —
      # it checks what's already published. Always exits 0; never fails this job.
      - name: Weekly reconcile against the city calendar
        if: steps.mode.outputs.mode == 'weekly'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reconcile.mjs

      - name: Research + merge (append-only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REFRESH_MODEL: ${{ vars.REFRESH_MODEL }}
          REFRESH_MODE: ${{ steps.mode.outputs.mode }}
          REFRESH_WINDOW: ${{ github.event.inputs.window }}
        run: |
          set -o pipefail
          node scripts/refresh.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} 2>&1 | tee refresh.log

      - name: Commit if the archive or the meetings calendar changed
        id: commit
        run: |
          if git diff --quiet -- data/topic-archive.json data/meetings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change — skipping deploy."
          else
            git config user.name  "GoodDevCo"
            git config user.email "298780910+GoodDevCo@users.noreply.github.com"
            git add data/topic-archive.json data/meetings.json
            git commit -m "Auto-refresh: append new Belle Isle records ($(TZ=America/New_York date +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A failed run used to be silent. Between 2026-08-02 and 2026-09-20 this workflow failed
      # 50 nights running — the Anthropic key was out of credit — and nothing said so anywhere.
      # One open issue per outage, a comment at most every 3 days, closed automatically on recovery.
      - name: Report the failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no output captured)';
            try {
              log = fs.readFileSync('refresh.log', 'utf8').trim().split('\n').slice(-20).join('\n');
            } catch (e) {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The daily refresh failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Last lines of output:',
              '```',
              log,
              '```',
              '',
              'While this is open, govagenda.org is serving a stale archive.',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['refresh-failure'],
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Auto-refresh is failing', body, labels: ['refresh-failure'],
              });
            } else {
              const age = Date.now() - new Date(existing[0].updated_at).getTime();
              if (age > 3 * 24 * 60 * 60 * 1000) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing[0].number, body: `Still failing.\n\n${body}`,
                });
              }
            }

      - name: Close the failure issue once a run succeeds
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['refresh-failure'],
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: `Refresh succeeded again — ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

      # Build + deploy in-workflow (the default token won't trigger deploy.yml on its own push).
      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: ./public

      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
